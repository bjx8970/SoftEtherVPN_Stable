name: Build OpenWrt Packages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openwrt-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64_cortex-a53
          - mips_24kc

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare exact source archive
        run: |
          archive="openwrt/net/softethervpn/softethervpn-source.tar.gz"
          tar --exclude=./.git --exclude="./$archive" -czf "$archive" .
          hash="$(sha256sum "$archive" | awk '{print $1}')"
          sed -i "s/^PKG_HASH:=.*/PKG_HASH:=$hash/" openwrt/net/softethervpn/Makefile

      - name: Build OpenWrt packages
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          FEED_DIR: ${{ github.workspace }}/openwrt
          FEEDNAME: softether
          PACKAGES: softethervpn-base softethervpn-server softethervpn-bridge softethervpn-client
          NO_SHFMT_CHECK: 1

      - name: Upload OpenWrt packages and build logs
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ matrix.arch }}
          path: |
            bin/packages/${{ matrix.arch }}/
            logs/
          if-no-files-found: error
          retention-days: 14
